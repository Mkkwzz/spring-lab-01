<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <h1 th:text="${title}">Catalogue</h1>
    <p th:if="${author}" class="filter">Filter by author: <b th:text="${author}">Bloch</b> · <a href="/books">show all</a></p>
    <p th:if="${message}" class="flash" th:text="${message}"></p>
    <table>
        <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th></tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.year}">2020</td>
        </tr>
    </table>
    <h2>Add a book</h2>
    <form method="post" action="/books" class="add">
        <input name="title" placeholder="Title" required>
        <input name="author" placeholder="Author" required>
        <input name="year" type="number" placeholder="Year" required>
        <button type="submit">Add</button>
    </form>
    <p><a href="/">Start page</a></p>
</body>
</html>
