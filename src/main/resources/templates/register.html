<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <h1>Create an account</h1>
    <p th:if="${error}" class="error" th:text="${error}">Username is already taken</p>
    <!-- th:action makes Thymeleaf add the hidden _csrf field -->
    <form th:action="@{/register}" method="post" class="add">
        <input name="username" placeholder="Username" th:value="${username}" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a th:href="@{/login}">Log in</a> · <a th:href="@{/}">Start page</a></p>
</body>
</html>
